name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pak.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(jq -r .version pak.json)
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::pak.json version $VERSION does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Test and package
        run: sh scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: favorite-toggle
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(jq -r --arg v "$GITHUB_REF_NAME" '.changelog[$v] // ""' pak.json)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "$NOTES"
